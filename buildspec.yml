version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    ECR_REPO: cicd-demo
    LAMBDA_NAME: cicd-demo
    ECR_URI: 277894851352.dkr.ecr.us-east-1.amazonaws.com

phases:

  pre_build:
    commands:
      - echo "PRE-BUILD PHASE STARTED"
      - echo "Logging into Amazon ECR"
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI
      - echo "ECR login successful"

  build:
    commands:
      - echo "BUILD PHASE STARTED"
      - echo "Building Docker image"
      - docker build -t $ECR_REPO:$CODEBUILD_RESOLVED_SOURCE_VERSION .

      - echo "Tagging Docker image"
      - docker tag $ECR_REPO:$CODEBUILD_RESOLVED_SOURCE_VERSION \

        $ECR_URI/$ECR_REPO:$CODEBUILD_RESOLVED_SOURCE_VERSION
      
      - echo "Docker build completed"

  post_build:
    commands:
      - echo "DEPLOYMENT PHASE STARTED"
      - echo "Pushing image to ECR"
      - docker push $ECR_URI/$ECR_REPO:$CODEBUILD_RESOLVED_SOURCE_VERSION

      - echo "Updating Lambda with new image"
      - aws lambda update-function-code \
        --function-name $LAMBDA_NAME \
        --image-uri $ECR_URI/$ECR_REPO:$CODEBUILD_RESOLVED_SOURCE_VERSION
        
      - echo "Deployment completed successfully"